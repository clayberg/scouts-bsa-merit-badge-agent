name: CI/CD Quality Gate & Multi-Metric Evaluation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-and-eval-gate:
    name: Blocking Lint, Pytest, Fault Injection & Pre-Deploy Eval Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (poppler-utils for PDF rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Blocking Ruff Static Linter
        run: |
          ruff check src/ tests/ scripts/

      - name: Run Full Unit, Security, Fault-Injection & OpenAPI Contract Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Run Blocking Multi-Metric Pre-Deployment Evaluation Gate
        run: |
          python3 scripts/eval_gate.py --min-recall 0.98 --min-ir-mrr 0.85 --max-aabb-overlaps 0 --min-faithfulness 0.80
