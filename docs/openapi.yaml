components:
  schemas:
    A2ATaskSendRequest:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        message:
          additionalProperties: true
          title: Message
          type: object
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        sessionId:
          default: a2a_default_session
          title: Sessionid
          type: string
      title: A2ATaskSendRequest
      type: object
    AdminCatalogImageUpdateRequest:
      properties:
        alternate_rank:
          anyOf:
          - type: integer
          - type: 'null'
          description: 0 for primary, 1+ for alternate rank.
          title: Alternate Rank
        badge_name:
          description: Official Scouts BSA Merit Badge name.
          title: Badge Name
          type: string
        caption:
          anyOf:
          - type: string
          - type: 'null'
          description: Updated instructional caption.
          title: Caption
        discard:
          anyOf:
          - type: boolean
          - type: 'null'
          description: True to hide/discard low-quality figure.
          title: Discard
        image_id:
          description: Target catalog image_id or filename.
          title: Image Id
          type: string
        is_alternate:
          anyOf:
          - type: boolean
          - type: 'null'
          description: True if alternate, False if primary default.
          title: Is Alternate
        req_number:
          anyOf:
          - type: string
          - type: 'null'
          description: Updated requirement tag (e.g. '1', '3a', 'Overview').
          title: Req Number
        title:
          anyOf:
          - type: string
          - type: 'null'
          description: Updated short display title.
          title: Title
      required:
      - badge_name
      - image_id
      title: AdminCatalogImageUpdateRequest
      type: object
    AdminPromotePrimaryRequest:
      properties:
        badge_name:
          description: Official Scouts BSA Merit Badge name.
          title: Badge Name
          type: string
        image_id:
          description: Target catalog image_id to promote to Primary Default.
          title: Image Id
          type: string
        req_number:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional requirement number override.
          title: Req Number
      required:
      - badge_name
      - image_id
      title: AdminPromotePrimaryRequest
      type: object
    AdminRecaptionVisionRequest:
      properties:
        badge_name:
          description: Official Scouts BSA Merit Badge name.
          title: Badge Name
          type: string
        image_id:
          description: Target catalog image_id to re-caption with Gemini Vision.
          title: Image Id
          type: string
        req_number:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional requirement number context.
          title: Req Number
      required:
      - badge_name
      - image_id
      title: AdminRecaptionVisionRequest
      type: object
    AdminUnlockRequest:
      properties:
        token:
          default: ''
          description: Super-User Admin token or passphrase (`ADMIN_SUPERUSER_TOKEN`).
          title: Token
          type: string
      title: AdminUnlockRequest
      type: object
    AnonymousImageSwapTelemetryRequest:
      properties:
        badge_name:
          default: First Aid
          description: Merit Badge name (anonymous).
          title: Badge Name
          type: string
        event_type:
          default: counselor_visual_swap
          description: Event type (`counselor_visual_swap`, `nano_regen`, etc.).
          title: Event Type
          type: string
        from_image_id:
          default: ''
          description: Previous image ID.
          title: From Image Id
          type: string
        req_number:
          default: '1'
          description: Requirement number.
          title: Req Number
          type: string
        to_image_id:
          default: ''
          description: Selected image ID.
          title: To Image Id
          type: string
      title: AnonymousImageSwapTelemetryRequest
      type: object
    CounselorFeedbackRequest:
      properties:
        badge_name:
          default: First Aid
          description: Merit Badge evaluated by the Counselor.
          title: Badge Name
          type: string
        comments:
          default: ''
          description: Optional Counselor notes or improvement suggestions.
          title: Comments
          type: string
        counselor_name:
          default: Scoutmaster Bob
          description: Merit Badge Counselor name.
          title: Counselor Name
          type: string
        rating:
          default: 5
          description: Counselor quality rating (1 to 5 stars).
          maximum: 5.0
          minimum: 1.0
          title: Rating
          type: integer
        requirement_accuracy_verified:
          default: true
          description: Whether the Counselor verified 100% sub-requirement fidelity.
          title: Requirement Accuracy Verified
          type: boolean
        requirement_count:
          default: 5
          description: Number of official requirements verified in this session.
          minimum: 1.0
          title: Requirement Count
          type: integer
        session_id:
          default: a2ui_workbench_session
          description: Session identifier.
          title: Session Id
          type: string
        thumbs_up:
          default: true
          description: True for positive endorsement, False for issue flag.
          title: Thumbs Up
          type: boolean
      title: CounselorFeedbackRequest
      type: object
    CounselorProfileSaveRequest:
      properties:
        counselor_name:
          default: Scoutmaster Bob
          title: Counselor Name
          type: string
        custom_troop_logo_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Troop Logo Path
        email_address:
          default: counselor@troop123.org
          title: Email Address
          type: string
        location_or_zip:
          default: ''
          title: Location Or Zip
          type: string
        phone_number:
          default: (000) 555-1234
          title: Phone Number
          type: string
        troop_affiliation:
          default: Troop 123, My Council
          title: Troop Affiliation
          type: string
      title: CounselorProfileSaveRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    NanoBananaCostRequest:
      properties:
        badge_name:
          title: Badge Name
          type: string
        bullet_points:
          items:
            type: string
          title: Bullet Points
          type: array
        custom_prompt:
          default: ''
          title: Custom Prompt
          type: string
        include_humans:
          anyOf:
          - {}
          - type: 'null'
          default: auto
          title: Include Humans
        num_images:
          default: 1
          maximum: 4.0
          minimum: 1.0
          title: Num Images
          type: integer
        prompt:
          default: ''
          title: Prompt
          type: string
        req_number:
          default: '1'
          title: Req Number
          type: string
        slide_title:
          default: ''
          title: Slide Title
          type: string
        visual_style:
          default: Photorealistic Image
          title: Visual Style
          type: string
      required:
      - badge_name
      title: NanoBananaCostRequest
      type: object
    NanoBananaGenerateRequest:
      properties:
        accent_palette_key:
          default: NAVY_GOLD
          title: Accent Palette Key
          type: string
        badge_name:
          title: Badge Name
          type: string
        beautification_tier:
          default: STUDIO
          title: Beautification Tier
          type: string
        bullet_points:
          items:
            type: string
          title: Bullet Points
          type: array
        custom_prompt:
          default: ''
          title: Custom Prompt
          type: string
        include_humans:
          anyOf:
          - {}
          - type: 'null'
          default: auto
          title: Include Humans
        prompt:
          default: ''
          title: Prompt
          type: string
        req_number:
          default: '1'
          title: Req Number
          type: string
        requirement_id:
          default: ''
          title: Requirement Id
          type: string
        slide_title:
          default: ''
          title: Slide Title
          type: string
        user_consented:
          default: false
          title: User Consented
          type: boolean
        visual_style:
          default: Photorealistic Image
          title: Visual Style
          type: string
      required:
      - badge_name
      title: NanoBananaGenerateRequest
      type: object
    SlideImageUploadRequest:
      properties:
        badge_name:
          title: Badge Name
          type: string
        data_url:
          default: ''
          description: Base64 Data URL or raw base64 content of the uploaded image.
          title: Data Url
          type: string
        description:
          default: ''
          title: Description
          type: string
        filename:
          default: uploaded_slide_image.png
          title: Filename
          type: string
        image_base64:
          default: ''
          description: Optional alias for data_url.
          title: Image Base64
          type: string
        req_number:
          default: '1'
          title: Req Number
          type: string
        slide_title:
          default: ''
          title: Slide Title
          type: string
        title:
          default: ''
          title: Title
          type: string
      required:
      - badge_name
      title: SlideImageUploadRequest
      type: object
    SlideRegenerateRequest:
      properties:
        badge_name:
          title: Badge Name
          type: string
        counselor_info:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Optional counselor personalization info.
          title: Counselor Info
        custom_image_caption:
          anyOf:
          - type: string
          - type: 'null'
          description: Caption for the selected image.
          title: Custom Image Caption
        custom_image_path:
          anyOf:
          - type: string
          - type: 'null'
          description: Path to a selected catalog/web/AI image.
          title: Custom Image Path
        custom_image_source_label:
          anyOf:
          - type: string
          - type: 'null'
          description: Source label for the selected image.
          title: Custom Image Source Label
        new_accent_palette:
          anyOf:
          - type: string
          - type: 'null'
          title: New Accent Palette
        new_archetype:
          description: Target SlideArchetype value
          title: New Archetype
          type: string
        new_diagram_type:
          anyOf:
          - type: string
          - type: 'null'
          title: New Diagram Type
        new_visual_theme:
          anyOf:
          - type: string
          - type: 'null'
          title: New Visual Theme
        output_path:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional existing .pptx output path to update.
          title: Output Path
        slide_data:
          additionalProperties: true
          title: Slide Data
          type: object
        slide_index:
          description: 0-based index in storyboard.slides
          title: Slide Index
          type: integer
        storyboard_slides:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          description: Optional full list of storyboard slides to immediately rebuild
            the .pptx file on disk.
          title: Storyboard Slides
        visual_source_mode:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Override mode: ''keep_current'', ''restore_original'', ''custom_image'',
            ''ai_hero'', or ''none''.'
          title: Visual Source Mode
      required:
      - badge_name
      - slide_index
      - new_archetype
      title: SlideRegenerateRequest
      type: object
    StudioKitAgendaRequest:
      properties:
        badge_name:
          default: First Aid
          title: Badge Name
          type: string
        counselor_info:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Counselor Info
        counselor_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Counselor Name
        location_or_zip:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Or Zip
        research_result:
          additionalProperties: true
          title: Research Result
          type: object
        schedule_format:
          default: 3 Troop Meetings (45 min each)
          title: Schedule Format
          type: string
        schedule_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Schedule Type
        troop_affiliation:
          anyOf:
          - type: string
          - type: 'null'
          title: Troop Affiliation
      title: StudioKitAgendaRequest
      type: object
    TroopLogoUploadRequest:
      properties:
        data_url:
          description: Base64 Data URL or raw base64 content of the image.
          title: Data Url
          type: string
        filename:
          description: Uploaded image filename (.png, .jpg, .jpeg).
          title: Filename
          type: string
      required:
      - filename
      - data_url
      title: TroopLogoUploadRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WebImageSearchRequest:
      properties:
        badge_name:
          title: Badge Name
          type: string
        bullet_points:
          items:
            type: string
          title: Bullet Points
          type: array
        max_results:
          default: 16
          maximum: 24.0
          minimum: 1.0
          title: Max Results
          type: integer
        req_number:
          default: '1'
          title: Req Number
          type: string
        search_query:
          default: ''
          title: Search Query
          type: string
        slide_title:
          default: ''
          title: Slide Title
          type: string
      required:
      - badge_name
      title: WebImageSearchRequest
      type: object
    WorkflowRunRequest:
      properties:
        audience_level:
          default: All Scouts (Ages 11–17)
          description: Target Scout audience level.
          title: Audience Level
          type: string
        badge_name:
          default: First Aid
          description: Official Merit Badge name.
          title: Badge Name
          type: string
        beautification_tier:
          default: BEAUTIFIED
          description: '''STANDARD'', ''BEAUTIFIED'', or ''STUDIO''.'
          title: Beautification Tier
          type: string
        counselor_name:
          default: Scoutmaster Bob
          description: Merit Badge Counselor name.
          title: Counselor Name
          type: string
        custom_troop_logo_path:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional path to custom Troop Logo PNG/JPG.
          title: Custom Troop Logo Path
        depth_mode:
          default: Deep Dive / Camp School Deck
          description: '''Standard Deck'' or ''Deep Dive / Camp School Deck'''
          title: Depth Mode
          type: string
        email_address:
          anyOf:
          - type: string
          - type: 'null'
          default: counselor@troop123.org
          description: Counselor contact email.
          title: Email Address
        enable_deep_research:
          default: true
          description: Whether to run Tier-2 grounded web & local troop research.
          title: Enable Deep Research
          type: boolean
        location_or_zip:
          anyOf:
          - type: string
          - type: 'null'
          default: ''
          description: Optional City, State or 5-digit ZIP code for local NOAA/USGS/field
            grounding.
          title: Location Or Zip
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          default: (000) 555-1234
          description: Counselor contact phone.
          title: Phone Number
        schedule_format:
          default: 3 Troop Meetings (45 min each)
          description: Counselor lesson schedule format.
          title: Schedule Format
          type: string
        session_id:
          default: a2ui_workbench_session
          description: Persistent counselor session ID.
          title: Session Id
          type: string
        troop_affiliation:
          default: Troop 123, My Council
          description: Troop and Council affiliation.
          title: Troop Affiliation
          type: string
        webhook_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional webhook callback URL notified on completion.
          title: Webhook Url
      title: WorkflowRunRequest
      type: object
info:
  description: Production ADK multi-agent system with 5-Tier Deep Pamphlet Research,
    12-Archetype Slide Engine, Tri-Modal Visual Synthesis, 2-Stage Conformance/Vision
    Critic, FastMCP HITL Confirmation Tokens, and Google Material 3 Expressive A2UI.
  title: Scouts BSA Merit Badge Agent — Material 3 Expressive A2UI & A2A 1.0 Server
  version: 3.1.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Serves the Google Material 3 Expressive A2UI Counselor Workbench.
      operationId: serve_a2ui_workbench__get
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Serve A2Ui Workbench
  /.well-known/agent.json:
    get:
      description: Returns the authoritative A2A 1.0 Agent Card for enterprise discovery.
      operationId: get_a2a_agent_card__well_known_agent_json_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get A2A Agent Card  Well Known Agent Json Get
                type: object
          description: Successful Response
      summary: Get A2A Agent Card
  /a2a/tasks/send:
    post:
      description: Executes an A2A 1.0 task and returns A2UI v0.9 DataPart payloads.
      operationId: a2a_send_task_a2a_tasks_send_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - in: header
        name: X-API-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2ATaskSendRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response A2A Send Task A2A Tasks Send Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: A2A Send Task
  /a2a/tasks/{task_id}:
    get:
      operationId: a2a_get_task_a2a_tasks__task_id__get
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - in: header
        name: X-API-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response A2A Get Task A2A Tasks  Task Id  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: A2A Get Task
  /a2a/tasks/{task_id}/cancel:
    post:
      operationId: a2a_cancel_task_a2a_tasks__task_id__cancel_post
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          title: Task Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - in: header
        name: X-API-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response A2A Cancel Task A2A Tasks  Task Id  Cancel Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: A2A Cancel Task
  /api/admin/catalog/image:
    patch:
      description: Updates caption, title, requirement tag, or role for a cached catalog
        image.
      operationId: api_admin_update_catalog_image_api_admin_catalog_image_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCatalogImageUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Api Admin Update Catalog Image Api Admin Catalog Image
                  Patch
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Api Admin Update Catalog Image
  /api/admin/catalog/images:
    get:
      description: Lists all cached images, captions, and roles for a Merit Badge
        in the Admin Console.
      operationId: api_admin_list_catalog_images_api_admin_catalog_images_get
      parameters:
      - in: query
        name: badge_name
        required: false
        schema:
          default: First Aid
          title: Badge Name
          type: string
      - in: query
        name: req_number
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Req Number
      - in: query
        name: source_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Type
      - in: query
        name: role
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Api Admin List Catalog Images Api Admin Catalog Images
                  Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Api Admin List Catalog Images
  /api/admin/catalog/promote-primary:
    post:
      description: Promotes an Alternate visual to Primary Default for its requirement
        and demotes the prior Primary.
      operationId: api_admin_promote_catalog_primary_api_admin_catalog_promote_primary_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPromotePrimaryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Api Admin Promote Catalog Primary Api Admin Catalog
                  Promote Primary Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Api Admin Promote Catalog Primary
  /api/admin/catalog/recaption-vision:
    post:
      description: Re-captions a cached catalog image using Gemini 2.5 Flash Vision.
      operationId: api_admin_recaption_catalog_vision_api_admin_catalog_recaption_vision_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRecaptionVisionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Api Admin Recaption Catalog Vision Api Admin Catalog
                  Recaption Vision Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Api Admin Recaption Catalog Vision
  /api/admin/circuit-breakers/reset:
    post:
      description: Resets all downstream circuit breakers back to CLOSED.
      operationId: api_admin_reset_circuit_breakers_api_admin_circuit_breakers_reset_post
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Api Admin Reset Circuit Breakers Api Admin Circuit
                  Breakers Reset Post
                type: object
          description: Successful Response
      summary: Api Admin Reset Circuit Breakers
  /api/admin/diagnostics/assets:
    get:
      description: Returns the 144-Badge Asset Health Matrix (covers, emblems, pamphlet
        figures, Nano Banana heroes).
      operationId: api_admin_diagnostics_assets_api_admin_diagnostics_assets_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Api Admin Diagnostics Assets Api Admin Diagnostics
                  Assets Get
                type: object
          description: Successful Response
      summary: Api Admin Diagnostics Assets
  /api/admin/lock:
    post:
      description: Locks the Super-User Admin Console for the current browser session.
      operationId: api_admin_lock_api_admin_lock_post
      responses:
