components:
  schemas:
    A2ATaskSendRequest:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        sessionId:
          type: string
          title: Sessionid
          default: a2a_default_session
        message:
          additionalProperties: true
          type: object
          title: Message
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      type: object
      title: A2ATaskSendRequest
    AdminCatalogImageUpdateRequest:
      properties:
        badge_name:
          type: string
          title: Badge Name
          description: Official Scouts BSA Merit Badge name.
        image_id:
          type: string
          title: Image Id
          description: Target catalog image_id or filename.
        caption:
          anyOf:
          - type: string
          - type: 'null'
          title: Caption
          description: Updated instructional caption.
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Updated short display title.
        req_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Req Number
          description: Updated requirement tag (e.g. '1', '3a', 'Overview').
        is_alternate:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Alternate
          description: True if alternate, False if primary default.
        alternate_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Alternate Rank
          description: 0 for primary, 1+ for alternate rank.
        discard:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Discard
          description: True to hide/discard low-quality figure.
      type: object
      required:
      - badge_name
      - image_id
      title: AdminCatalogImageUpdateRequest
    AdminPromotePrimaryRequest:
      properties:
        badge_name:
          type: string
          title: Badge Name
          description: Official Scouts BSA Merit Badge name.
        image_id:
          type: string
          title: Image Id
          description: Target catalog image_id to promote to Primary Default.
        req_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Req Number
          description: Optional requirement number override.
      type: object
      required:
      - badge_name
      - image_id
      title: AdminPromotePrimaryRequest
    AdminRecaptionVisionRequest:
      properties:
        badge_name:
          type: string
          title: Badge Name
          description: Official Scouts BSA Merit Badge name.
        image_id:
          type: string
          title: Image Id
          description: Target catalog image_id to re-caption with Gemini Vision.
        req_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Req Number
          description: Optional requirement number context.
      type: object
      required:
      - badge_name
      - image_id
      title: AdminRecaptionVisionRequest
    AdminReplaceCatalogImageRequest:
      properties:
        badge_name:
          type: string
          title: Badge Name
          description: Official Scouts BSA Merit Badge name.
        image_id:
          type: string
          title: Image Id
          description: Target catalog image_id or filename to replace in-place.
        image_data_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Data Uri
          description: Base64 PNG/JPG data URI from local file upload.
        regenerate_nano:
          type: boolean
          title: Regenerate Nano
          description: True to regenerate in-place with Nano Banana AI.
          default: false
        custom_prompt:
          type: string
          title: Custom Prompt
          description: Optional custom prompt for Nano Banana regeneration.
          default: ''
      type: object
      required:
      - badge_name
      - image_id
      title: AdminReplaceCatalogImageRequest
    AdminUnlockRequest:
      properties:
        token:
          type: string
          title: Token
          description: Super-User Admin token or passphrase (`ADMIN_SUPERUSER_TOKEN`).
          default: ''
      type: object
      title: AdminUnlockRequest
    AnonymousImageSwapTelemetryRequest:
      properties:
        badge_name:
          type: string
          title: Badge Name
          description: Merit Badge name (anonymous).
          default: First Aid
        req_number:
          type: string
          title: Req Number
          description: Requirement number.
          default: '1'
        event_type:
          type: string
          title: Event Type
          description: Event type (`counselor_visual_swap`, `nano_regen`, etc.).
          default: counselor_visual_swap
        from_image_id:
          type: string
          title: From Image Id
          description: Previous image ID.
          default: ''
        to_image_id:
          type: string
          title: To Image Id
          description: Selected image ID.
          default: ''
      type: object
      title: AnonymousImageSwapTelemetryRequest
    CounselorFeedbackRequest:
      properties:
        badge_name:
          type: string
          title: Badge Name
          description: Merit Badge evaluated by the Counselor.
          default: First Aid
        counselor_name:
          type: string
          title: Counselor Name
          description: Merit Badge Counselor name.
          default: Scoutmaster Bob
        session_id:
          type: string
          title: Session Id
          description: Session identifier.
          default: a2ui_workbench_session
        rating:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Rating
          description: Counselor quality rating (1 to 5 stars).
          default: 5
        thumbs_up:
          type: boolean
          title: Thumbs Up
          description: True for positive endorsement, False for issue flag.
          default: true
        requirement_accuracy_verified:
          type: boolean
          title: Requirement Accuracy Verified
          description: Whether the Counselor verified 100% sub-requirement fidelity.
          default: true
        requirement_count:
          type: integer
          minimum: 1.0
          title: Requirement Count
          description: Number of official requirements verified in this session.
          default: 5
        comments:
          type: string
          title: Comments
          description: Optional Counselor notes or improvement suggestions.
          default: ''
      type: object
      title: CounselorFeedbackRequest
    CounselorProfileSaveRequest:
      properties:
        counselor_name:
          type: string
          title: Counselor Name
          default: Scoutmaster Bob
        troop_affiliation:
          type: string
          title: Troop Affiliation
          default: Troop 123, My Council
        location_or_zip:
          type: string
          title: Location Or Zip
          default: ''
        email_address:
          type: string
          title: Email Address
          default: counselor@troop123.org
        phone_number:
          type: string
          title: Phone Number
          default: (000) 555-1234
        custom_troop_logo_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Troop Logo Path
      type: object
      title: CounselorProfileSaveRequest
    DeckStylePreferencesRequest:
      properties:
        default_template_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Template Id
          description: Default template profile ID.
        default_slide_theme:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Slide Theme
          description: Default slide theme ('WARM_CREAM', 'CRISP_WHITE', 'DARK_SLATE').
        default_layout_style_preset:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Layout Style Preset
          description: Default layout style preset ('AUTO_TEMPLATE', 'CLEAN_OPEN',
            'LEFT_ACCENT_LINE', 'BOXED_CARDS').
        layout_style_preset:
          anyOf:
          - type: string
          - type: 'null'
          title: Layout Style Preset
          description: Alias for default_layout_style_preset.
        text_container_style:
          anyOf:
          - type: string
          - type: 'null'
          title: Text Container Style
          description: Optional granular text container style ('CLEAN_OPEN', 'LEFT_ACCENT_LINE',
            'BOXED_CARDS').
        image_frame_style:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Frame Style
          description: Optional granular image frame style ('FRAMELESS_CLEAN', 'SOFT_SHADOW',
            'FRAMED_CARD').
        header_chrome_style:
          anyOf:
          - type: string
          - type: 'null'
          title: Header Chrome Style
          description: Optional granular header chrome style ('MINIMAL_ACCENT', 'SOLID_PILL').
        typography_scale:
          anyOf:
          - type: string
          - type: 'null'
          title: Typography Scale
          description: Typography scale ('COMFORTABLE', 'COMPACT', 'LARGE').
        safety_banner_mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Safety Banner Mode
          description: Safety banner mode ('HAZARD_ONLY', 'ALL_SLIDES', 'HIDDEN').
        match_template_palette:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Match Template Palette
          description: Whether to harmonize card accents with the template's brand
